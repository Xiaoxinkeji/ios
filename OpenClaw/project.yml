name: OpenClaw
options:
  bundleIdPrefix: com.xiaoxinkeji
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.2"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  OpenClaw:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoxinkeji.openclaw
        INFOPLIST_FILE: Sources/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
